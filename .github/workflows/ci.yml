name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  laravel:
    name: Laravel tests (PHP 8.5)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api/src
    # Feature, security and migration tests run on MySQL 8.4 — the production engine (ADR-0011).
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: alphamaster_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot --silent"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: alphamaster_test
      DB_USERNAME: root
      DB_PASSWORD: root
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: pdo_mysql, pdo_sqlite, bcmath, intl, zip
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Security audit
        run: composer audit

      - name: Prepare app
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Code style
        run: vendor/bin/pint --test

      - name: Migrations, rollback and permission sync
        run: |
          set -e
          php artisan migrate:fresh --seed --force
          php artisan access:sync-permissions
          php artisan access:sync-permissions   # must be idempotent
          php artisan migrate:rollback --force
          php artisan migrate --force
          php artisan db:seed --force

      - name: Unit, API feature, security and MySQL integration tests
        run: vendor/bin/phpunit

  docker:
    name: Docker build & smoke test
    runs-on: ubuntu-latest
    env:
      COMPOSE_FILE: docker-compose.yml:docker-compose.data.yml:docker-compose.backend.yml:docker-compose.ports.yml
    steps:
      - uses: actions/checkout@v5

      - name: Create .env
        run: |
          {
            echo "APP_KEY=base64:$(openssl rand -base64 32)"
            echo "APP_URL=http://localhost:8080"
            echo "DB_NAME=AlphaMaster"
            echo "DB_USER=AlphaMaster"
            echo "DB_PASSWORD=$(openssl rand -hex 24)"
            echo "DB_ROOT_PASSWORD=$(openssl rand -hex 24)"
            echo "API_PORT=8080"
          } > .env

      - name: Validate compose files
        run: docker compose config --quiet

      - name: Build and start
        run: docker compose up -d --build --wait --wait-timeout 180

      - name: Migrate and sync permissions
        run: |
          docker exec AlphaMaster-API php artisan migrate --force
          docker exec AlphaMaster-API php artisan access:sync-permissions

      - name: Smoke tests
        run: |
          set -e
          check() { code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:8080$1"); echo "$1 -> $code"; [ "$code" = "$2" ]; }
          check /up 200
          check / 200
          check /.env 403
          check /nope.php 403

      - name: Auth flow on the hardened image
        run: |
          set -e
          # Throwaway owner, created inside the app (there is no HTTP bootstrap endpoint).
          docker exec -i AlphaMaster-API php < .github/ci/create-smoke-owner.php
          code() { curl -s -o /dev/null -w '%{http_code}' "$@"; }
          expect() { echo "$1 -> $2"; [ "$2" = "$3" ]; }
          curl -s http://localhost:8080/api/v1/auth/me | grep -q '"code":"UNAUTHENTICATED"'
          login() { curl -s -H 'Content-Type: application/json' -d "{\"identifier\":\"ci.owner\",\"password\":\"$1\",\"device_name\":\"ci\",\"client\":\"admin\"}" http://localhost:8080/api/v1/auth/tokens; }
          login wrong | grep -q '"code":"INVALID_CREDENTIALS"'
          token=$(login 'Ci-password-12345' | sed -E 's/.*"token":"([^"]+)".*/\1/')
          auth=(-H "Authorization: Bearer $token")
          expect "me" "$(code "${auth[@]}" http://localhost:8080/api/v1/auth/me)" 200
          expect "admin users" "$(code "${auth[@]}" http://localhost:8080/api/v1/admin/users)" 200
          expect "permissions" "$(code "${auth[@]}" http://localhost:8080/api/v1/admin/access/permissions)" 200
          expect "logout" "$(code -X POST "${auth[@]}" http://localhost:8080/api/v1/auth/logout)" 204
          expect "revoked token" "$(code "${auth[@]}" http://localhost:8080/api/v1/auth/me)" 401

      - name: Security checks
        run: |
          set -e
          docker exec AlphaMaster-API php -r 'exit(function_exists("exec") || function_exists("shell_exec") || function_exists("proc_open") || function_exists("putenv") ? 1 : 0);'
          docker exec AlphaMaster-API sh -c '! test -e /usr/local/bin/php-cgi'
          [ "$(docker exec AlphaMaster-API id -u)" != "0" ]
          ! curl -sI http://localhost:8080/up | grep -qi '^x-powered-by'
          docker exec AlphaMaster-API php -r 'exit(version_compare(PHP_VERSION, "8.5.0", ">=") ? 0 : 1);'

      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail 100

      - name: Tear down
        if: always()
        run: docker compose down -v
