; AlphaMaster-API PHP hardening

; Don't leak version / errors
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /proc/self/fd/2

; Block shell execution (PHP-to-shell / RCE)
disable_functions = exec,shell_exec,system,passthru,proc_open,popen,pcntl_exec,pcntl_fork,proc_nice,proc_terminate,proc_get_status,dl,putenv,mail,link,symlink,mb_send_mail,imap_mail
enable_dl = Off

; No remote file inclusion
allow_url_fopen = Off
allow_url_include = Off

; Restrict filesystem access
open_basedir = /var/www/html:/tmp

; CGI path tricks (defense in depth — CGI isn't used)
cgi.fix_pathinfo = 0

; Uploads / limits
file_uploads = On
upload_max_filesize = 10M
post_max_size = 12M
max_file_uploads = 5
max_execution_time = 30
max_input_time = 30
memory_limit = 256M

; Sessions
session.use_strict_mode = 1
session.use_only_cookies = 1
session.cookie_httponly = 1
session.cookie_secure = 1
session.cookie_samesite = Strict

; Opcache (production)
opcache.enable = 1
opcache.validate_timestamps = 0

; Expose container env vars to Laravel via $_ENV (putenv/getenv adapter is disabled above)
variables_order = "EGPCS"
