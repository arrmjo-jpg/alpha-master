<VirtualHost *:8080>
    ServerName localhost
    DocumentRoot /var/www/html/public

    <Directory /var/www/html>
        Require all denied
        Options None
        AllowOverride None
    </Directory>

    <Directory /var/www/html/public>
        Require all granted
        Options -Indexes -ExecCGI -Includes -FollowSymLinks +SymLinksIfOwnerMatch
        AllowOverride None

        # Front controller: everything goes through index.php
        RewriteEngine On

        # Pass the Authorization (Bearer token) and XSRF headers to PHP. Laravel's
        # public/.htaccess normally does this, but .htaccess is disabled (AllowOverride None).
        RewriteCond %{HTTP:Authorization} .
        RewriteRule .* - [E=HTTP_AUTHORIZATION:%{HTTP:Authorization}]
        RewriteCond %{HTTP:x-xsrf-token} .
        RewriteRule .* - [E=HTTP_X_XSRF_TOKEN:%{HTTP:X-XSRF-Token}]
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteRule ^ index.php [L]
    </Directory>

    # Only index.php may execute as PHP
    <FilesMatch "\.(php|phtml|phar|php\d*)$">
        Require all denied
    </FilesMatch>
    <Files "index.php">
        Require all granted
    </Files>

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
