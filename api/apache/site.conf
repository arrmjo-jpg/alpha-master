<VirtualHost *:8080>
    ServerName localhost
    DocumentRoot /var/www/html/public

    <Directory /var/www/html>
        Require all denied
        Options None
        AllowOverride None
    </Directory>

    <Directory /var/www/html/public>
        Require all granted
        Options -Indexes -ExecCGI -Includes -FollowSymLinks +SymLinksIfOwnerMatch
        AllowOverride None

        # Front controller: everything goes through index.php
        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteRule ^ index.php [L]
    </Directory>

    # Only index.php may execute as PHP
    <FilesMatch "\.(php|phtml|phar|php\d*)$">
        Require all denied
    </FilesMatch>
    <Files "index.php">
        Require all granted
    </Files>

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
