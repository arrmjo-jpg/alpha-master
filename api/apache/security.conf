ServerTokens Prod
ServerSignature Off
TraceEnable Off
FileETag None

# Block hidden files (.env, .git, ...)
<FilesMatch "^\.">
    Require all denied
</FilesMatch>
<DirectoryMatch "/\.">
    Require all denied
</DirectoryMatch>

Header always set X-Content-Type-Options "nosniff"
Header always set X-Frame-Options "DENY"
Header always set Referrer-Policy "no-referrer"
Header always unset X-Powered-By
