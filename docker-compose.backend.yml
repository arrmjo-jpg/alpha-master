# AlphaMaster-API — Laravel on PHP 8.5
services:
  api:
    build: ./api
    image: alphamaster-api:latest
    container_name: AlphaMaster-API
    restart: unless-stopped
    environment:
      APP_NAME: AlphaMaster
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY}
      APP_URL: ${APP_URL:-http://localhost:8080}
      LOG_CHANNEL: stderr
      APP_LOCALE: ${APP_LOCALE:-ar}
      APP_SUPPORTED_LOCALES: ${APP_SUPPORTED_LOCALES:-ar,en}
      # Auth / SPA (ADR-0003). Production domains are undecided: set them per environment.
      SANCTUM_STATEFUL_DOMAINS: ${SANCTUM_STATEFUL_DOMAINS:-localhost,localhost:3000,localhost:5173,127.0.0.1}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      SESSION_DOMAIN: ${SESSION_DOMAIN:-}
      SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE:-false}
      SANCTUM_ADMIN_TOKEN_TTL_DAYS: ${SANCTUM_ADMIN_TOKEN_TTL_DAYS:-30}
      SANCTUM_PUBLIC_TOKEN_TTL_DAYS: ${SANCTUM_PUBLIC_TOKEN_TTL_DAYS:-90}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_NAME}
      DB_USERNAME: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
      - /var/run/apache2
      - /var/lock/apache2
      - /var/www/html/bootstrap/cache:uid=33,gid=33,mode=0770
      - /var/www/html/storage/framework/cache:uid=33,gid=33,mode=0770
      - /var/www/html/storage/framework/sessions:uid=33,gid=33,mode=0770
      - /var/www/html/storage/framework/views:uid=33,gid=33,mode=0770
      - /var/www/html/storage/logs:uid=33,gid=33,mode=0770
    volumes:
      - alphamaster-storage:/var/www/html/storage/app
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    networks: [alphamaster]
