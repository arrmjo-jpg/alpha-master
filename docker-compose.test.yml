# Test suite against an isolated, throwaway MySQL 8.4 (never the real AlphaMaster-DB).
# Usage: docker compose -f docker-compose.test.yml run --rm --build --name AlphaMaster-API-Test api-test
#        docker compose -f docker-compose.test.yml down   # removes AlphaMaster-TestDB afterwards
name: alphamaster-test

services:
  db-test:
    image: mysql:8.4
    container_name: AlphaMaster-TestDB
    environment:
      MYSQL_ROOT_PASSWORD: test
      MYSQL_DATABASE: alphamaster_test
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-ptest", "--silent"]
      interval: 3s
      timeout: 3s
      retries: 40

  api-test:
    build:
      context: ./api
      target: dev
    image: alphamaster-api:dev
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db-test
      DB_PORT: 3306
      DB_DATABASE: alphamaster_test
      DB_USERNAME: root
      DB_PASSWORD: test
    depends_on:
      db-test:
        condition: service_healthy
